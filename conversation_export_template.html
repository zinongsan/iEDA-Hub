<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} - 对话记录</title>
  <link rel="icon" href="/frontend/assets/images/nctieda_logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-primary: #024BA1;
      --color-secondary: #0F2C5E;
      --color-bg: #F5F7FB;
      --color-surface: #FFFFFF;
      --color-text-primary: #1E293B;
      --color-text-secondary: #64748B;
      --color-border: #E2E8F0;
      --color-user: #024BA1;
      --color-ai: #0a5fc0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-bg);
      color: var(--color-text-primary);
      line-height: 1.6;
    }

    /* 顶部导航 */
    .navbar {
      background: linear-gradient(90deg, #013A80 0%, #024BA1 60%, #0a5fc0 100%);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      box-shadow: 0 2px 12px rgba(2, 75, 161, 0.18);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
    }

    .navbar-inner {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .navbar .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 600;
      color: white;
      text-decoration: none;
      letter-spacing: 0.2px;
    }

    .navbar .logo img {
      height: 28px;
      object-fit: contain;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .export-info {
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: white;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 主容器 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 88px 32px 40px 32px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--color-text-primary);
    }

    .page-description {
      font-size: 15px;
      color: var(--color-text-secondary);
    }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid var(--color-border);
    }

    .stat-label {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--color-primary);
    }

    /* 消息容器 */
    .messages-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid var(--color-border);
      overflow: hidden;
    }

    .messages-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--color-border);
      background: #fafbfc;
    }

    .messages-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .messages {
      padding: 24px;
      max-height: none;
    }

    .message {
      margin-bottom: 32px;
      display: flex;
      gap: 16px;
      padding: 20px;
      border-radius: 12px;
      background: #fafbfc;
      border: 1px solid var(--color-border);
    }

    .message:last-child {
      margin-bottom: 0;
    }

    .message.user {
      background: #f0f6ff;
      border-color: #d1e3ff;
    }

    .message.ai {
      background: #fafbfc;
      border-color: var(--color-border);
    }

    .message-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .message.user .message-icon {
      background: linear-gradient(135deg, #024BA1 0%, #0a5fc0 100%);
    }

    .message.ai .message-icon {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .message-content {
      flex: 1;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .message-role {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .message.user .message-role {
      color: var(--color-primary);
    }

    .message-meta {
      font-size: 12px;
      color: var(--color-text-secondary);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .message-text {
      color: var(--color-text-primary);
      font-size: 14px;
      line-height: 1.7;
    }

    .message-text p {
      margin-bottom: 12px;
    }

    .message-text p:last-child {
      margin-bottom: 0;
    }

    .message-text strong {
      font-weight: 600;
      color: var(--color-text-primary);
    }

    .message-text code {
      background: rgba(2, 75, 161, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      color: var(--color-primary);
    }

    .rating {
      color: #f59e0b;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }

    .cost {
      color: #10b981;
      font-weight: 600;
    }

    /* 来源引用 */
    .sources {
      margin-top: 16px;
      padding: 16px;
      background: white;
      border-radius: 8px;
      border: 1px solid var(--color-border);
    }

    .sources-title {
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .source-item {
      padding: 8px 0;
      color: var(--color-text-secondary);
      font-size: 13px;
      border-bottom: 1px solid var(--color-border);
      line-height: 1.6;
    }

    .source-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    /* 底部 */
    .footer {
      margin-top: 40px;
      padding: 24px;
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 13px;
    }

    .footer a {
      color: var(--color-primary);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* 打印样式 */
    @media print {
      body {
        background: white;
        padding: 0;
      }

      .navbar {
        position: relative;
      }

      .container {
        padding: 20px;
      }

      .message {
        page-break-inside: avoid;
      }
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .container {
        padding: 72px 16px 24px 16px;
      }

      .page-title {
        font-size: 24px;
      }

      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .message {
        padding: 16px;
      }

      .export-info {
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="logo">
        <img src="/frontend/assets/images/nctieda_logo.png" alt="Logo">
        <span>iEDA-Hub AI问答系统</span>
      </div>
      <div class="navbar-right">
        <div class="user-badge">
          <span>👤</span>
          <span>{{USERNAME}}</span>
        </div>
        <div class="export-info">
          <span>📅 导出时间: {{EXPORT_TIME}}</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主容器 -->
  <div class="container">
    <!-- 页面标题 -->
    <div class="page-header">
      <h1 class="page-title">{{TITLE}}</h1>
      <p class="page-description">对话时间: {{CONVERSATION_TIME}}</p>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">消息总数</div>
        <div class="stat-value">{{MESSAGE_COUNT}}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">用户提问</div>
        <div class="stat-value">{{USER_COUNT}}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">AI回答</div>
        <div class="stat-value">{{AI_COUNT}}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总成本(元)</div>
        <div class="stat-value">{{TOTAL_COST}}</div>
      </div>
    </div>

    <!-- 消息列表 -->
    <div class="messages-container">
      <div class="messages-header">
        <h2>对话内容</h2>
      </div>
      <div class="messages">
        {{MESSAGES}}
      </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
      <p>导出自 <a href="#">iEDA-Hub AI智能问答系统</a></p>
      <p style="margin-top: 8px;">© 2024 GuoChuang Technology. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
