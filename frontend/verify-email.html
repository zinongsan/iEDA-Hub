<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>邮箱验证 - iEDAHub</title>
<link rel="stylesheet" href="/frontend/assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="/frontend/iedahub_navy_flat.svg">
<style>
body{background:#0f2c5e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
body::before,body::after{display:none!important;content:none!important}
body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 80%,rgba(255,255,255,.06) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,255,255,.05) 0%,transparent 50%);pointer-events:none;z-index:0;display:block!important}
.auth-wrapper{display:flex;flex-direction:column;align-items:center;width:100%;max-width:560px;padding:40px 28px;position:relative;z-index:1;text-align:center}
.brand-logo{display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;width:90px;height:90px;border-radius:22px;overflow:hidden}
.brand-logo img{height:90px;width:90px;object-fit:cover}
.card{position:relative;z-index:1;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:44px 40px;width:100%;animation:cardIn .5s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.icon{font-size:48px;margin-bottom:14px}
.card h1{font-size:24px;font-weight:700;margin-bottom:10px;color:#024BA1}
.card .desc{color:#64748b;font-size:14px;line-height:1.7;margin-bottom:20px}
.btn{display:inline-block;padding:12px 30px;border:none;border-radius:10px;background:#024BA1;color:#fff;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;transition:all .2s}
.btn:hover{background:#013A7E;transform:translateY(-1px)}
.spinner{display:inline-block;width:26px;height:26px;border:3px solid #E5E7EB;border-top-color:#024BA1;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.alt{margin-top:18px;font-size:13px;color:#6B7280}
.alt a{color:#024BA1;text-decoration:none;font-weight:600}
.footer{margin-top:24px;font-size:12px;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<div class="auth-wrapper">
    <div class="brand-logo"><img src="/frontend/iedahub_navy_flat.svg" alt="iEDAHub" onerror="this.style.display='none'"></div>
    <div class="card" id="card">
        <div class="spinner" id="spin"></div>
        <h1 id="title">正在验证邮箱…</h1>
        <div class="desc" id="desc">请稍候</div>
    </div>
    <div class="footer">© EDA 国家集成电路设计自动化技术创新中心</div>
</div>
<script type="module">
import { api } from '/frontend/assets/js/api.js';
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const spin = document.getElementById('spin');
const card = document.getElementById('card');
const token = new URLSearchParams(location.search).get('token');
async function fail(msg) {
    spin.style.display = 'none';
    title.textContent = '验证失败';
    title.style.color = '#B91C1C';
    desc.innerHTML = msg + '<br><div class="alt"><a href="/login">← 返回登录</a> 或登录后在个人中心重新发送验证邮件</div>';
}
if (!token) {
    fail('验证链接无效（缺少令牌）。');
} else {
    try {
        const r = await api('/api/v1/auth/verify-email', {
            method: 'POST', body: JSON.stringify({ token })
        });
        spin.style.display = 'none';
        title.textContent = '✅ 邮箱验证成功';
        title.style.color = '#047857';
        desc.innerHTML = (r.message || '你的邮箱已验证成功') + '<br><br><a class="btn" href="/login">前往登录</a>';
    } catch (err) {
        fail(err.message || '验证链接无效或已过期');
    }
}
</script>
</body>
</html>
