<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>操作日志 - iEDA-Hub</title>
<link rel="icon" href="/frontend/assets/images/nctieda_logo.png">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --color-primary: #024BA1;
    --color-secondary: #0F2C5E;
    --color-bg: #F5F7FB;
    --color-surface: #FFFFFF;
    --color-text-primary: #1E293B;
    --color-text-secondary: #64748B;
    --color-border: #E2E8F0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--color-bg);
    color: var(--color-text-primary);
}

/* 顶部导航 - 与主页一致 */
.navbar {
    background: linear-gradient(90deg, #013A80 0%, #024BA1 60%, #0a5fc0 100%);
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    box-shadow: 0 2px 12px rgba(2, 75, 161, 0.18);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
}

.navbar-inner {
    width: 100%;
    max-width: 1600px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.navbar .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 600;
    color: white;
    text-decoration: none;
    cursor: pointer;
    letter-spacing: 0.2px;
    transition: opacity 0.2s;
}

.navbar .logo:hover {
    opacity: 0.9;
}

.navbar .logo svg {
    flex-shrink: 0;
}

.navbar .logo img {
    height: 28px;
    flex-shrink: 0;
}

.navbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.nav-back {
    background: rgba(255, 255, 255, 0.16);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.28);
    padding: 7px 20px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    backdrop-filter: blur(6px);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.nav-back:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
}

/* 导航栏下拉菜单 */
.nav-menu-wrapper {
    position: relative;
}

.nav-menu-trigger {
    background: rgba(255, 255, 255, 0.16);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.28);
    padding: 7px 16px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    backdrop-filter: blur(6px);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
}

.nav-menu-trigger:hover {
    background: rgba(255, 255, 255, 0.28);
}

.nav-menu-dropdown {
    position: absolute;
    top: calc(100% + 12px);
    right: 0;
    min-width: 220px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.04);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: all 0.2s ease;
    overflow: hidden;
    z-index: 1000;
}

.nav-menu-wrapper:hover .nav-menu-dropdown {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.nav-menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    color: var(--color-text-primary);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.15s;
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: inherit;
}

.nav-menu-item:hover {
    background: #F0F6FF;
    color: var(--color-primary);
}

.nav-menu-item.active {
    background: #EBF3FF;
    color: var(--color-primary);
    font-weight: 600;
}

.nav-menu-icon {
    font-size: 16px;
    width: 20px;
    text-align: center;
}

.nav-menu-divider {
    height: 1px;
    background: var(--color-border);
    margin: 4px 0;
}

/* 主容器 */
.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 88px 32px 40px 32px;  /* top增加以适应固定导航栏 56px + 32px */
}

.page-header {
    margin-bottom: 32px;
}

.page-title {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
}

.page-description {
    font-size: 15px;
    color: var(--color-text-secondary);
}

/* 统计卡片 */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
}

.stat-card {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.stat-label {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-bottom: 8px;
}

.stat-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--color-primary);
}

/* 筛选区域 */
.filters {
    background: white;
    padding: 24px;
    border-radius: 16px;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.filters-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: flex-end;
}

.filter-group {
    flex: 1;
    min-width: 200px;
}

.filter-label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
}

.filter-input, .filter-select {
    width: 100%;
    padding: 10px 14px;
    border: 2px solid var(--color-border);
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.2s;
}

.filter-input:focus, .filter-select:focus {
    outline: none;
    border-color: var(--color-primary);
}

.btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
}

.btn-primary {
    background: var(--color-primary);
    color: white;
}

.btn-primary:hover {
    background: #013A7E;
}

.btn-secondary {
    background: var(--color-border);
    color: var(--color-text-primary);
}

.btn-secondary:hover {
    background: #CBD5E1;
}

/* 日志表格 */
.logs-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    overflow: hidden;
}

.logs-table {
    width: 100%;
    border-collapse: collapse;
}

.logs-table th {
    background: #F8FAFC;
    padding: 16px;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-text-secondary);
    border-bottom: 2px solid var(--color-border);
}

.logs-table td {
    padding: 16px;
    border-bottom: 1px solid var(--color-border);
    font-size: 14px;
}

.logs-table tr:hover {
    background: #F8FAFC;
}

.action-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
}

.action-login { background: #DBEAFE; color: #1E40AF; }
.action-register { background: #D1FAE5; color: #065F46; }
.action-profile { background: #FEF3C7; color: #92400E; }
.action-avatar { background: #FCE7F3; color: #9F1239; }
.action-password { background: #FECACA; color: #991B1B; }
.action-ai-qa { background: #E0E7FF; color: #3730A3; }  /* AI问答专用样式 */

.ip-address {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: var(--color-text-secondary);
}

.timestamp {
    font-size: 13px;
    color: var(--color-text-secondary);
}

/* 分页 */
.pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 24px;
}

.page-btn {
    padding: 8px 12px;
    border: 1px solid var(--color-border);
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
}

.page-btn:hover {
    border-color: var(--color-primary);
    color: var(--color-primary);
}

.page-btn.active {
    background: var(--color-primary);
    color: white;
    border-color: var(--color-primary);
}

.page-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.loading {
    text-align: center;
    padding: 60px;
    color: var(--color-text-secondary);
}

.empty {
    text-align: center;
    padding: 60px;
    color: var(--color-text-secondary);
}

.error {
    background: #FEF2F2;
    color: #991B1B;
    padding: 16px 20px;
    border-radius: 8px;
    margin-bottom: 24px;
    border-left: 4px solid #DC2626;
}

/* 详情模态框 */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: white;
    border-radius: 16px;
    padding: 32px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.modal-title {
    font-size: 20px;
    font-weight: 700;
}

.modal-close {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--color-text-secondary);
}

.detail-row {
    margin-bottom: 16px;
}

.detail-label {
    font-size: 13px;
    color: var(--color-text-secondary);
    margin-bottom: 4px;
}

.detail-value {
    font-size: 14px;
    color: var(--color-text-primary);
    word-break: break-all;
}

.detail-json {
    background: #F8FAFC;
    padding: 12px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="navbar">
    <div class="navbar-inner">
        <a href="/app/iedahub" class="logo">
            <svg width="22" height="22" viewBox="0 0 28 28" style="flex-shrink:0">
                <path d="M8,3 L22,3 A3,3 0 0 1 25,6 L25,22 A3,3 0 0 1 22,25 L6,25 A3,3 0 0 1 3,22 L3,8 Z" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="1.8"/>
                <rect x="10" y="10" width="8" height="8" rx="1.5" fill="#fff" opacity="0.5"/>
                <rect x="0" y="9" width="3" height="2.5" fill="#fff"/>
                <rect x="0" y="16.5" width="3" height="2.5" fill="#fff"/>
                <rect x="25" y="9" width="3" height="2.5" fill="#fff"/>
                <rect x="25" y="16.5" width="3" height="2.5" fill="#fff"/>
            </svg>
            <span>iEDAHub</span>
        </a>
        <div class="navbar-right" id="navbarRight" style="opacity:0;transition:opacity 0.2s;">
            <a href="/profile" class="nav-back" id="backLink">← 返回个人中心</a>
        </div>
    </div>
</nav>

<!-- 主容器 -->
<div class="container">
    <div class="page-header">
        <h1 class="page-title">📊 操作日志</h1>
        <p class="page-description">查看您的账号操作记录</p>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            <div class="stat-label">总操作次数</div>
            <div class="stat-value" id="statTotal">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">最近7天</div>
            <div class="stat-value" id="statWeek">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">最常操作</div>
            <div class="stat-value" style="font-size:18px;" id="statTopAction">-</div>
        </div>
    </div>

    <!-- 错误提示 -->
    <div id="errorMsg" class="error" style="display:none;"></div>

    <!-- 筛选区域 -->
    <div class="filters">
        <div class="filters-row">
            <div class="filter-group">
                <label class="filter-label">操作类型</label>
                <select class="filter-select" id="filterAction">
                    <option value="">全部</option>
                    <option value="ai.qa">AI问答</option>
                    <option value="user.login">登录</option>
                    <option value="user.register">注册</option>
                    <option value="user.complete_profile">完善信息</option>
                    <option value="user.update_profile">更新资料</option>
                    <option value="user.upload_avatar">上传头像</option>
                    <option value="user.change_password">修改密码</option>
                    <option value="user.update_notification">更新通知</option>
                </select>
            </div>
            <div class="filter-group">
                <label class="filter-label">时间范围</label>
                <select class="filter-select" id="filterDays">
                    <option value="">全部</option>
                    <option value="1">最近1天</option>
                    <option value="7" selected>最近7天</option>
                    <option value="30">最近30天</option>
                    <option value="90">最近90天</option>
                </select>
            </div>
            <div>
                <button class="btn btn-primary" onclick="loadLogs()">🔍 查询</button>
                <button class="btn btn-secondary" onclick="resetFilters()">🔄 重置</button>
            </div>
        </div>
    </div>

    <!-- 日志列表 -->
    <div class="logs-card">
        <div id="loadingMsg" class="loading">加载中...</div>
        <div id="emptyMsg" class="empty" style="display:none;">暂无日志记录</div>
        <table class="logs-table" id="logsTable" style="display:none;">
            <thead>
                <tr>
                    <th>操作类型</th>
                    <th>IP地址</th>
                    <th>操作时间</th>
                    <th>详情</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
            </tbody>
        </table>

        <!-- 分页 -->
        <div class="pagination" id="pagination" style="display:none;"></div>
    </div>
</div>

<!-- 详情模态框 -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">日志详情</h3>
            <button class="modal-close" onclick="closeDetailModal()">×</button>
        </div>
        <div id="detailContent"></div>
    </div>
</div>

<script type="module">
import { api, tokenStore, logout } from '/frontend/assets/js/api.js';

if (!tokenStore.get()) {
    location.href = '/login?next=' + encodeURIComponent(location.pathname);
}

// 检查用户角色并更新导航栏
(async function checkUserRole() {
    try {
        const user = await api('/api/v1/users/me');
        const navbarRight = document.getElementById('navbarRight');

        if (user.is_admin || user.role === 'teacher') {
            // 教师/管理员：显示下拉菜单
            navbarRight.innerHTML = `
                <div class="nav-menu-wrapper">
                    <button class="nav-menu-trigger">
                        <span>📚 教师中心</span>
                        <span style="font-size:10px;">▼</span>
                    </button>
                    <div class="nav-menu-dropdown">
                        <a href="/app/teacher-dashboard.html" class="nav-menu-item">
                            <span class="nav-menu-icon">👤</span>
                            <span>个人信息</span>
                        </a>
                        <a href="/app/teacher-dashboard.html" class="nav-menu-item">
                            <span class="nav-menu-icon">📋</span>
                            <span>审核中心</span>
                        </a>
                        <a href="/app/teacher-dashboard.html" class="nav-menu-item">
                            <span class="nav-menu-icon">📊</span>
                            <span>工作台概览</span>
                        </a>
                        <div class="nav-menu-divider"></div>
                        <a href="/logs" class="nav-menu-item active">
                            <span class="nav-menu-icon">📝</span>
                            <span>操作日志</span>
                        </a>
                        <a href="/app/iedahub.html" class="nav-menu-item">
                            <span class="nav-menu-icon">🏠</span>
                            <span>返回主页</span>
                        </a>
                    </div>
                </div>
            `;
        } else {
            // 普通用户：显示返回个人中心按钮
            const backLink = document.getElementById('backLink');
            backLink.href = '/profile';
            backLink.textContent = '← 返回个人中心';
        }

        // 显示导航栏
        navbarRight.style.opacity = '1';
    } catch (err) {
        console.error('获取用户信息失败:', err);
        // 出错时也显示导航栏（默认内容）
        document.getElementById('navbarRight').style.opacity = '1';
    }
})();

let currentPage = 1;
let pageSize = 20;
let totalPages = 1;

// 加载统计
async function loadStats() {
    try {
        const stats = await api('/api/v1/logs/stats?days=7');
        document.getElementById('statTotal').textContent = stats.total_logs || 0;
        document.getElementById('statWeek').textContent = stats.total_logs || 0;

        if (stats.by_action && Object.keys(stats.by_action).length > 0) {
            const topAction = Object.entries(stats.by_action)
                .sort((a, b) => b[1] - a[1])[0];
            const actionName = getActionName(topAction[0]);
            document.getElementById('statTopAction').textContent = actionName;
        } else {
            document.getElementById('statTopAction').textContent = '无';
        }
    } catch (err) {
        console.error('统计加载失败:', err);
    }
}

// 加载日志列表
async function loadLogs(page = 1) {
    currentPage = page;
    document.getElementById('loadingMsg').style.display = 'block';
    document.getElementById('logsTable').style.display = 'none';
    document.getElementById('emptyMsg').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('pagination').style.display = 'none';

    const action = document.getElementById('filterAction').value;
    const days = document.getElementById('filterDays').value;

    let url = `/api/v1/logs/me?page=${page}&page_size=${pageSize}`;
    if (action) url += `&action=${action}`;
    if (days) url += `&days=${days}`;

    try {
        const data = await api(url);

        document.getElementById('loadingMsg').style.display = 'none';

        if (!data.items || data.items.length === 0) {
            document.getElementById('emptyMsg').style.display = 'block';
            return;
        }

        // 渲染表格
        const tbody = document.getElementById('logsTableBody');
        tbody.innerHTML = data.items.map(log => `
            <tr>
                <td>
                    <span class="action-badge ${getActionClass(log.action)}">
                        ${getActionName(log.action)}
                    </span>
                </td>
                <td><span class="ip-address">${log.ip_address || '-'}</span></td>
                <td><span class="timestamp">${formatTime(log.created_at)}</span></td>
                <td>
                    <button class="btn btn-secondary" style="padding:4px 12px;font-size:12px;" onclick="window.showDetail(${log.id})">
                        查看
                    </button>
                </td>
            </tr>
        `).join('');

        document.getElementById('logsTable').style.display = 'table';

        // 渲染分页
        totalPages = Math.ceil(data.total / pageSize);
        renderPagination(data.total);

    } catch (err) {
        document.getElementById('loadingMsg').style.display = 'none';
        document.getElementById('errorMsg').textContent = '加载失败：' + err.message;
        document.getElementById('errorMsg').style.display = 'block';
    }
}

// 渲染分页
function renderPagination(total) {
    if (totalPages <= 1) return;

    const pagination = document.getElementById('pagination');
    let html = '';

    // 上一页
    html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="window.loadLogs(${currentPage - 1})">上一页</button>`;

    // 页码
    for (let i = 1; i <= Math.min(totalPages, 10); i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="window.loadLogs(${i})">${i}</button>`;
    }

    if (totalPages > 10) {
        html += `<span style="padding:8px;">...</span>`;
    }

    // 下一页
    html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="window.loadLogs(${currentPage + 1})">下一页</button>`;

    pagination.innerHTML = html;
    pagination.style.display = 'flex';
}

// 显示详情
let allLogs = [];
window.showDetail = async function(logId) {
    try {
        // 重新获取当前页数据
        const action = document.getElementById('filterAction').value;
        const days = document.getElementById('filterDays').value;
        let url = `/api/v1/logs/me?page=${currentPage}&page_size=${pageSize}`;
        if (action) url += `&action=${action}`;
        if (days) url += `&days=${days}`;

        const data = await api(url);
        const log = data.items.find(l => l.id === logId);

        if (!log) {
            alert('日志不存在');
            return;
        }

        const content = document.getElementById('detailContent');
        content.innerHTML = `
            <div class="detail-row">
                <div class="detail-label">操作ID</div>
                <div class="detail-value">#${log.id}</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">操作类型</div>
                <div class="detail-value">
                    <span class="action-badge ${getActionClass(log.action)}">
                        ${getActionName(log.action)}
                    </span>
                </div>
            </div>
            <div class="detail-row">
                <div class="detail-label">IP地址</div>
                <div class="detail-value ip-address">${log.ip_address || '未记录'}</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">User-Agent</div>
                <div class="detail-value" style="font-size:12px;">${log.user_agent || '未记录'}</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">操作时间</div>
                <div class="detail-value">${formatTimeFull(log.created_at)}</div>
            </div>
            ${log.details && Object.keys(log.details).length > 0 ? `
            <div class="detail-row">
                <div class="detail-label">详细信息</div>
                <div class="detail-json">${JSON.stringify(log.details, null, 2)}</div>
            </div>
            ` : ''}
        `;

        document.getElementById('detailModal').classList.add('show');
    } catch (err) {
        alert('获取详情失败：' + err.message);
    }
};

window.closeDetailModal = function() {
    document.getElementById('detailModal').classList.remove('show');
};

// 重置筛选
window.resetFilters = function() {
    document.getElementById('filterAction').value = '';
    document.getElementById('filterDays').value = '7';
    loadLogs(1);
};

// 工具函数
function getActionClass(action) {
    if (action.includes('login')) return 'action-login';
    if (action.includes('register')) return 'action-register';
    if (action.includes('profile')) return 'action-profile';
    if (action.includes('avatar')) return 'action-avatar';
    if (action.includes('password')) return 'action-password';
    if (action.includes('ai.qa')) return 'action-ai-qa';
    return 'action-profile';
}

function getActionName(action) {
    const names = {
        'user.login': '登录',
        'user.logout': '登出',
        'user.register': '注册',
        'user.complete_profile': '完善信息',
        'user.update_profile': '更新资料',
        'user.upload_avatar': '上传头像',
        'user.change_password': '修改密码',
        'user.update_notification': '更新通知设置',
        'ai.qa': 'AI问答'
    };
    return names[action] || action;
}

function formatTime(ts) {
    const date = new Date(ts);
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);

    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
    if (diff < 604800) return Math.floor(diff / 86400) + '天前';

    return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', {hour: '2-digit', minute: '2-digit'});
}

function formatTimeFull(ts) {
    const date = new Date(ts);
    return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
}

// 导出全局函数
window.loadLogs = loadLogs;

// 初始化
loadStats();
loadLogs(1);

// 点击模态框外部关闭
document.getElementById('detailModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeDetailModal();
    }
});
</script>
