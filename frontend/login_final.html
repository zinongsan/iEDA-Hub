<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - iEDAHub</title>
<link rel="stylesheet" href="/frontend/assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="/frontend/iedahub_navy_flat.svg">
<style>
/* ===== 基于原始样式 ===== */
body {
    background: #0f2c5e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
}
body::before, body::after { display: none !important; content: none !important; }

body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(circle at 20% 80%, rgba(255,255,255,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
    display: block !important;
}

.auth-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 620px;
    padding: 40px 28px;
    position: relative;
    z-index: 1;
}

/* ===== 品牌头部（原始样式 - 登录页简洁） ===== */
.brand {
    text-align: center;
    margin-bottom: 40px;
}
.brand-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    width: 120px;
    height: 120px;
    border-radius: 24px;  /* 原始样式：有圆角 */
    overflow: hidden;
}
.brand-logo img {
    height: 120px;
    width: 120px;
    object-fit: cover;
}
.brand-title {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.2);
    line-height: 1.3;
    margin-bottom: 12px;
}
.brand-subtitle {
    font-size: 17px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 2px;
    font-weight: 400;
}

/* ===== 登录卡片 ===== */
.card {
    position: relative;
    z-index: 1;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    padding: 52px 56px 44px;
    width: 100%;
    animation: cardIn .5s ease;
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}
.card h1 {
    text-align: center;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 12px;
    color: #024BA1;
}
.card .tip {
    text-align: center;
    color: #6B7280;
    font-size: 14px;
    margin-bottom: 28px;
}
.card .tip a {
    color: #024BA1;
    text-decoration: none;
    font-weight: 600;
}
.card .tip a:hover {
    text-decoration: underline;
}

/* ===== 表单 ===== */
.field { margin-bottom: 24px; position: relative; }
.field label {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 10px;
}
.field input {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid #E5E7EB;
    border-radius: 12px;
    font-size: 17px;
    background: #F9FAFB;
    transition: all .2s ease;
    color: #111827;
}
.field input:focus {
    outline: none;
    border-color: #024BA1;
    background: #fff;
    box-shadow: 0 0 0 4px rgba(2,75,161,0.12);
}
.field input::placeholder { color: #9CA3AF; }
.field input.error { border-color: #EF4444; }

/* 密码显示/隐藏按钮 */
.password-wrapper { position: relative; }
.password-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    color: #6B7280;
    transition: color 0.2s;
}
.password-toggle:hover { color: #374151; }

/* 验证码容器（失败3次后显示） */
.captcha-container {
    display: none;
    margin-top: 20px;
}
.captcha-row {
    display: flex;
    gap: 8px;
    align-items: center;
}
.captcha-row input {
    flex: 1;
    padding: 16px 20px;
    border: 2px solid #E5E7EB;
    border-radius: 12px;
    font-size: 17px;
    background: #F9FAFB;
}
.captcha-img {
    height: 50px;
    width: 120px;
    border: 2px solid #E5E7EB;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.2s;
}
.captcha-img:hover { opacity: 0.8; }
.captcha-refresh {
    padding: 16px 20px;
    background: #F9FAFB;
    border: 2px solid #E5E7EB;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: #6B7280;
    transition: all 0.2s;
}
.captcha-refresh:hover { background: #E5E7EB; }

/* 选项行 */
.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 20px 0;
    font-size: 14px;
}
.remember {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: #6B7280;
}
.remember input {
    cursor: pointer;
    width: auto;
    margin: 0;
    padding: 0;
}
.options a {
    color: #024BA1;
    text-decoration: none;
    font-weight: 600;
}
.options a:hover { text-decoration: underline; }

.btn {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: #024BA1;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .2s ease;
    box-shadow: 0 4px 14px rgba(2,75,161,0.35);
    margin-top: 8px;
}
.btn:hover:not(:disabled) {
    background: #013A7E;
    box-shadow: 0 8px 20px rgba(2,75,161,0.4);
    transform: translateY(-2px);
}
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { background: #9CA3AF; cursor: not-allowed; box-shadow: none; }

.alt {
    text-align: center;
    margin-top: 28px;
    font-size: 15px;
    color: #6B7280;
}
.alt a {
    color: #024BA1;
    text-decoration: none;
    font-weight: 600;
}
.alt a:hover { color: #013A7E; text-decoration: underline; }

.msg {
    padding: 13px 16px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 14px;
    display: none;
    border-left: 4px solid;
}
.msg.error   { background: #FEF2F2; color: #B91C1C; border-color: #EF4444; display: block; }
.msg.success { background: #ECFDF5; color: #047857; border-color: #10B981; display: block; }
.msg.warning { background: #FEF3C7; color: #92400E; border-color: #F59E0B; display: block; }

.footer {
    text-align: center;
    margin-top: 28px;
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.5px;
}
.footer a { color: rgba(255,255,255,0.85); text-decoration: none; }
.footer a:hover { text-decoration: underline; color: #fff; }

@media (max-width: 480px) {
    .auth-wrapper { padding: 28px 20px; }
    .card { padding: 36px 28px 32px; border-radius: 16px; }
    .brand-title { font-size: 32px; }
    .brand-logo { width: 96px; height: 96px; border-radius: 20px; }
    .brand-logo img { height: 96px; width: 96px; }
}
</style>
</head>
<body>
<div class="auth-wrapper">
    <div class="brand">
        <div class="brand-logo">
            <img src="/frontend/iedahub_navy_flat.svg" alt="iEDAHub" onerror="this.style.display='none'">
        </div>
        <div class="brand-title">iEDAHub</div>
        <div class="brand-subtitle">National Center of Technology Innovation for EDA</div>
    </div>

    <div class="card">
        <h1>欢迎回来</h1>
        <div class="tip">还没有账号？<a href="/register">立即注册</a></div>
        <div class="msg" id="msg"></div>
        <form id="form">
            <div class="field">
                <label>邮箱或用户名</label>
                <input type="text" id="account" name="account" placeholder="your@email.com 或 username" required autocomplete="username">
            </div>

            <div class="field">
                <label>密码</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="显示密码">👁️‍🗨️</button>
                </div>
            </div>

            <!-- 验证码（失败3次后显示） -->
            <div id="captchaContainer" class="captcha-container">
                <div class="captcha-row">
                    <input type="text" id="captchaCode" name="captchaCode" placeholder="请输入验证码" maxlength="4" autocomplete="off">
                    <img id="captchaImg" class="captcha-img" alt="点击刷新" title="点击刷新">
                    <button type="button" class="captcha-refresh" id="refreshCaptcha">刷新</button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="rememberMe" checked>
                    <span>记住我（7天）</span>
                </label>
                <a href="/forgot-password">忘记密码？</a>
            </div>

            <button type="submit" class="btn" id="btn">登 录</button>
        </form>
        <div class="alt">还没有账号？<a href="/register">立即注册</a></div>
    </div>

    <div class="footer">
        © EDA 国家集成电路设计自动化技术创新中心 · <a href="https://www.nctieda.com/" target="_blank">www.nctieda.com</a>
    </div>
</div>

<script src="/frontend/assets/js/auth-utils.js"></script>
<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const passwordInput = document.getElementById('password');
const togglePasswordBtn = document.getElementById('togglePassword');
const captchaContainer = document.getElementById('captchaContainer');
const captchaImg = document.getElementById('captchaImg');
const refreshCaptchaBtn = document.getElementById('refreshCaptcha');
const captchaCodeInput = document.getElementById('captchaCode');

let failCount = 0;
let captchaId = '';

togglePasswordBtn.addEventListener('click', () => {
    togglePasswordVisibility(passwordInput, togglePasswordBtn);
});

function setupCaptcha() {
    captchaContainer.style.display = 'block';
    if (!captchaId) {
        loadCaptcha(captchaImg).then(id => captchaId = id).catch(console.error);
        captchaImg.addEventListener('click', () => refreshCaptcha(captchaImg).then(id => captchaId = id));
        refreshCaptchaBtn.addEventListener('click', () => refreshCaptcha(captchaImg).then(id => captchaId = id));
    } else {
        refreshCaptcha(captchaImg).then(id => captchaId = id);
    }
}

form.onsubmit = async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = '登录中...';

    const fd = new FormData(e.target);
    const account = fd.get('account').trim();
    const password = fd.get('password');

    const requestBody = { account, password };

    if (captchaContainer.style.display === 'block') {
        const captchaCode = captchaCodeInput.value.trim();
        if (!captchaCode) {
            msg.className = 'msg error';
            msg.textContent = '请输入验证码';
            btn.disabled = false;
            btn.textContent = '登 录';
            return;
        }
        requestBody.captcha_id = captchaId;
        requestBody.captcha_code = captchaCode;
    }

    try {
        const user = await api('/api/v1/auth/login', {
            method: 'POST',
            body: JSON.stringify(requestBody),
        });

        const next = new URLSearchParams(location.search).get('next');
        const safeNext = next && next.startsWith('/') && !next.startsWith('//') && !next.startsWith('\\');
        if (safeNext) {
            location.href = next;
        } else if (user.is_admin) {
            location.href = '/admin';
        } else {
            location.href = '/app/iedahub';
        }
    } catch (err) {
        msg.className = 'msg error';
        msg.textContent = err.message;

        if (err.message.includes('还剩') || err.message.includes('验证码')) {
            const match = err.message.match(/还剩(\d+)次/);
            if (match) {
                failCount = 5 - parseInt(match[1]);
            }

            if (failCount >= 3 || err.message.includes('验证码')) {
                setupCaptcha();
                if (err.message.includes('还剩')) {
                    msg.className = 'msg warning';
                    msg.textContent = err.message + '（需要输入验证码）';
                }
            }
        }

        if (captchaContainer.style.display === 'block' && err.message.includes('验证码')) {
            setupCaptcha();
        }
    } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
    }
};
</script>
</body>
</html>
