<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘记密码 - iEDA-Hub</title>
<link rel="stylesheet" href="/frontend/assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="/frontend/iedahub_navy_flat.svg">
<style>
body{background:#0f2c5e;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
body::before,body::after{display:none!important;content:none!important}
body::after{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 80%,rgba(255,255,255,.06) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,255,255,.05) 0%,transparent 50%);pointer-events:none;z-index:0;display:block!important}
.auth-wrapper{display:flex;flex-direction:column;align-items:center;width:100%;max-width:620px;padding:40px 28px;position:relative;z-index:1}
.brand{text-align:center;margin-bottom:36px}
.brand-logo{display:inline-flex !important;align-items:center !important;justify-content:center !important;margin-bottom:20px !important;width:110px !important;height:110px !important;border-radius:24px !important;overflow:hidden !important}
.brand-logo img{height:110px !important;width:110px !important;object-fit:cover !important;filter:none !important;background:none !important;padding:0 !important;border-radius:0 !important}
.brand-title{font-size:40px;font-weight:700;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.2);margin-bottom:10px}
.brand-subtitle{font-size:15px;color:rgba(255,255,255,.8);letter-spacing:2px}
.card{position:relative;z-index:1;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:48px 52px 40px;width:100%;animation:cardIn .5s ease}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.card h1{text-align:center;font-size:26px;font-weight:700;margin-bottom:12px;color:#024BA1}
.card .tip{text-align:center;color:#64748b;font-size:13px;margin-bottom:28px;line-height:1.6}
.field{margin-bottom:22px}
.field label{display:block;font-size:15px;font-weight:600;color:#374151;margin-bottom:10px}
.field input{width:100%;padding:15px 18px;border:2px solid #E5E7EB;border-radius:12px;font-size:16px;background:#F9FAFB;color:#111827;transition:all .2s}
.field input:focus{outline:none;border-color:#024BA1;background:#fff;box-shadow:0 0 0 4px rgba(2,75,161,.12)}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:#024BA1;color:#fff;font-size:17px;font-weight:700;letter-spacing:2px;cursor:pointer;transition:all .2s;box-shadow:0 4px 14px rgba(2,75,161,.35);margin-top:6px}
.btn:hover:not(:disabled){background:#013A7E;transform:translateY(-2px)}
.btn:disabled{background:#9CA3AF;cursor:not-allowed}
.alt{text-align:center;margin-top:24px;font-size:14px;color:#6B7280}
.alt a{color:#024BA1;text-decoration:none;font-weight:600}
.alt a:hover{text-decoration:underline}
.msg{padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:14px;display:none;border-left:4px solid}
.msg.error{background:#FEF2F2;color:#B91C1C;border-color:#EF4444;display:block}
.msg.success{background:#ECFDF5;color:#047857;border-color:#10B981;display:block}
.footer{text-align:center;margin-top:26px;font-size:12px;color:rgba(255,255,255,.6)}
@media(max-width:480px){.auth-wrapper{padding:28px 18px}.card{padding:34px 26px}.brand-title{font-size:30px}}
</style>
</head>
<body>
<div class="auth-wrapper">
    <div class="brand">
        <div class="brand-logo"><img src="/frontend/iedahub_navy_flat.svg" alt="iEDA-Hub" onerror="this.style.display='none'"></div>
        <div class="brand-title">iEDA-Hub</div>
        <div class="brand-subtitle">National Center of Technology Innovation for EDA</div>
    </div>
    <div class="card">
        <h1>忘记密码</h1>
        <div class="tip">输入注册邮箱，我们将向其发送密码重置链接</div>
        <div class="msg" id="msg"></div>
        <form id="form">
            <div class="field">
                <label>邮箱</label>
                <input type="email" name="email" placeholder="请输入注册邮箱" required>
            </div>
            <button type="submit" class="btn" id="btn">发送重置链接</button>
        </form>
        <div class="alt"><a href="/login">← 返回登录</a></div>
    </div>
    <div class="footer">© EDA 国家集成电路设计自动化技术创新中心</div>
</div>
<script type="module">
import { api } from '/frontend/assets/js/api.js';
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const COOLDOWN = 60;
let cooldownTimer = null;

function startCooldown() {
    let remain = COOLDOWN;
    btn.disabled = true;
    btn.textContent = `重新发送 (${remain}s)`;
    if (cooldownTimer) clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
        remain -= 1;
        if (remain <= 0) {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            btn.disabled = false;
            btn.textContent = '发送重置链接';
        } else {
            btn.textContent = `重新发送 (${remain}s)`;
        }
    }, 1000);
}

document.getElementById('form').onsubmit = async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    btn.disabled = true; btn.textContent = '发送中...';
    const fd = new FormData(e.target);
    try {
        await api('/api/v1/auth/forgot-password', {
            method: 'POST', body: JSON.stringify({ email: fd.get('email') })
        });
        msg.className = 'msg success';
        msg.textContent = '若该邮箱已注册，重置链接已发送，请查收邮件（含垃圾箱）。链接 15 分钟内有效。';
        startCooldown();  // 提交后 60s 冷却：防重复发送 + 限制枚举探测速率
    } catch (err) {
        msg.className = 'msg error'; msg.textContent = err.message;
        btn.disabled = false; btn.textContent = '发送重置链接';
    }
};
</script>
</body>
</html>
