<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - EDA 国创中心综合服务平台</title>
<link rel="stylesheet" href="/frontend/assets/css/style.css">
<link rel="icon" type="image/svg+xml" href="/frontend/iedahub_navy_flat.svg">
<style>
/* ===== 基于原始样式 ===== */
.auth-wrapper {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 620px; padding: 40px 28px;
    position: relative; z-index: 1;
}
/* 品牌头部（注册页有装饰背景） */
.brand { text-align: center; margin-bottom: 40px; }
.brand-logo {
    display: inline-flex !important; align-items: center !important; justify-content: center !important;
    margin-bottom: 24px !important; width: 120px !important; height: 120px !important; border-radius: 26px !important;
    overflow: hidden !important; background: rgba(255,255,255,.14) !important;
    box-shadow: 0 12px 40px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.22) !important;
    backdrop-filter: blur(8px) !important; transition: transform .4s cubic-bezier(.2,.9,.3,1.1) !important;
}
.brand-logo:hover { transform: translateY(-4px) scale(1.03); }
.brand-logo img {
    height: 120px !important; width: 120px !important; filter: none !important;
    background: none !important; padding: 0 !important; border-radius: 0 !important;
}
.brand-title {
    font-size: 46px; font-weight: 700; letter-spacing: 1px; color: #fff;
    text-shadow: 0 4px 24px rgba(0,0,0,.28); line-height: 1.3; margin-bottom: 12px;
}
.brand-subtitle {
    font-size: 17px; color: rgba(255,255,255,.8); letter-spacing: 2px;
    font-weight: 400;
}
/* 卡片 */
.card {
    position: relative; z-index: 1; background: #fff;
    border-radius: 24px;
    box-shadow: 0 28px 70px rgba(0,0,0,.30), 0 0 0 1px rgba(255,255,255,.18) inset;
    padding: 52px 56px 44px; width: 100%;
    animation: cardIn .55s cubic-bezier(.2,.9,.3,1.05);
    transition: box-shadow .35s ease;
}
.card:hover {
    box-shadow: 0 34px 80px rgba(0,0,0,.34), 0 0 0 1px rgba(255,255,255,.24) inset;
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}
.card h1 {
    text-align: center; font-size: 28px; font-weight: 700; margin-bottom: 12px;
    background: linear-gradient(135deg, #024BA1, #1a6fcf);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.card .tip {
    text-align: center; color: #6B7280; font-size: 14px; margin-bottom: 28px;
}
.card .tip a { color: #024BA1; text-decoration: none; font-weight: 600; }
.card .tip a:hover { text-decoration: underline; }

/* 表单 */
.field { margin-bottom: 24px; position: relative; }
.field label {
    display: block; font-size: 15px; font-weight: 600; color: #374151;
    margin-bottom: 10px;
}
.field input {
    width: 100%; padding: 16px 20px; border: 2px solid #E5E7EB; border-radius: 14px;
    font-size: 17px; background: #F9FAFB; transition: all .22s ease; color: #111827;
}
.field input:focus {
    outline: none; border-color: #024BA1; background: #fff;
    box-shadow: 0 0 0 4px rgba(2,75,161,0.12);
}
.field input::placeholder { color: #9CA3AF; }
.field input.error { border-color: #EF4444; }
.field-error {
    display: none; color: #EF4444; font-size: 13px; margin-top: 6px;
}

/* 密码显示/隐藏 */
.password-wrapper { position: relative; }
.password-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer;
    font-size: 18px; padding: 4px 8px; color: #6B7280;
}
.password-toggle:hover { color: #374151; }

/* 密码强度指示器 */
.password-strength {
    margin-top: 8px; display: flex; align-items: center; gap: 8px;
}
.strength-bar-bg {
    flex: 1; height: 4px; background: #E5E7EB; border-radius: 2px; overflow: hidden;
}
.strength-bar {
    height: 100%; transition: all 0.3s; border-radius: 2px; width: 0;
}
.strength-bar.weak { width: 33%; background: #EF4444; }
.strength-bar.medium { width: 66%; background: #F59E0B; }
.strength-bar.strong { width: 100%; background: #10B981; }
.strength-text { font-size: 12px; font-weight: 500; min-width: 24px; }
.strength-text.weak { color: #EF4444; }
.strength-text.medium { color: #F59E0B; }
.strength-text.strong { color: #10B981; }

/* 密码提示 */
.password-hints {
    margin: 8px 0 0 0; padding: 0; list-style: none; font-size: 12px;
}
.password-hints .hint { color: #94A3B8; margin: 4px 0; }
.password-hints .hint.valid { color: #10B981; }

/* 验证码 */
.captcha-row {
    display: flex;
    gap: 8px;
    align-items: stretch; /* 改为stretch让所有元素高度一致 */
}
.captcha-row input {
    flex: 1 1 auto; /* 允许增长和缩小，但保持最小宽度 */
    min-width: 150px; /* 设置最小宽度 */
}
.captcha-img {
    height: 50px; width: 120px; border: 2px solid #E5E7EB;
    border-radius: 8px; cursor: pointer; transition: opacity 0.2s;
    flex-shrink: 0; /* 防止缩小 */
}
.captcha-img:hover { opacity: 0.8; }
.captcha-refresh {
    padding: 16px 20px;
    background: #F9FAFB;
    border: 2px solid #E5E7EB;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: #6B7280;
    transition: all 0.2s;
    white-space: nowrap; /* 防止文字换行 */
    flex-shrink: 0; /* 防止按钮缩小 */
}
.captcha-refresh:hover { background: #E5E7EB; }
.captcha-refresh:disabled {
    background: #F3F4F6;
    color: #9CA3AF;
    cursor: not-allowed;
}

/* 协议 */
.agreements {
    margin: 20px 0; font-size: 13px; color: #6B7280;
}
.agreements label {
    display: flex; align-items: flex-start; gap: 8px; cursor: pointer;
}
.agreements input[type="checkbox"] {
    margin-top: 2px; cursor: pointer; width: auto;
}
.agreements a { color: #024BA1; text-decoration: none; }
.agreements a:hover { text-decoration: underline; }

.btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    background: #024BA1; color: #fff; font-size: 18px; font-weight: 700;
    letter-spacing: 2px; cursor: pointer; transition: all .25s ease;
    box-shadow: 0 6px 20px rgba(2,75,161,0.38); margin-top: 8px;
    position: relative; overflow: hidden;
}
.btn::after {
    content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent, rgba(255,255,255,.22), transparent);
    transform: translateX(-120%); transition: transform .65s ease;
}
.btn:hover:not(:disabled) {
    box-shadow: 0 12px 26px rgba(2,75,161,0.46); transform: translateY(-2px); filter: brightness(1.05);
}
.btn:hover:not(:disabled)::after { transform: translateX(120%); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { background: #9CA3AF; cursor: not-allowed; box-shadow: none; }

.alt {
    text-align: center; margin-top: 28px; font-size: 15px; color: #6B7280;
}
.alt a { color: #024BA1; text-decoration: none; font-weight: 600; transition: color .2s; }
.alt a:hover { color: #1a6fcf; text-decoration: underline; }

.msg {
    padding: 13px 16px; border-radius: 12px; margin-bottom: 18px; font-size: 14px;
    display: none; border-left: 4px solid; animation: msgIn .3s ease;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.msg.error   { background: #FEF2F2; color: #B91C1C; border-color: #EF4444; display: block; }
.msg.success { background: #ECFDF5; color: #047857; border-color: #10B981; display: block; }

.footer {
    text-align: center; margin-top: 28px; font-size: 13px;
    color: rgba(255,255,255,.6); letter-spacing: .5px;
}
.footer a { color: rgba(255,255,255,.85); text-decoration: none; }
.footer a:hover { text-decoration: underline; color: #fff; }

@media (max-width: 480px) {
    .auth-wrapper { padding: 28px 20px; max-width: 100%; }
    .card { padding: 36px 28px 32px; border-radius: 18px; }
    .brand-title { font-size: 32px; }
    .brand-subtitle { font-size: 14px; }
    .brand-logo { width: 96px; height: 96px; border-radius: 22px; }
    .brand-logo img { height: 68px; }
    .card h1 { font-size: 24px; }
    .field input { font-size: 16px; padding: 14px 16px; }
    .btn { font-size: 16px; padding: 14px; }
}
</style>
</head>
<body>
<div class="auth-wrapper">
    <div class="brand">
        <div class="brand-logo">
            <img src="/frontend/iedahub_navy_flat.svg" alt="iEDA-Hub" onerror="this.style.display='none'">
        </div>
        <div class="brand-title">iEDA-Hub</div>
        <div class="brand-subtitle">National Center of Technology Innovation for EDA</div>
    </div>

    <div class="card">
        <h1>创建新账号</h1>
        <div class="msg" id="msg"></div>
        <form id="form">
            <div class="field">
                <label>邮箱</label>
                <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
                <div class="field-error"></div>
            </div>

            <div class="field">
                <label>用户名</label>
                <input type="text" id="username" name="username" placeholder="3-50个字符" required autocomplete="username" minlength="3" maxlength="50">
                <div class="field-error"></div>
            </div>

            <div class="field">
                <label>密码</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="至少8位" required autocomplete="new-password" minlength="8" maxlength="128">
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="显示密码">👁️‍🗨️</button>
                </div>
                <div class="password-strength">
                    <div class="strength-bar-bg">
                        <div class="strength-bar weak" id="strengthBar"></div>
                    </div>
                    <span class="strength-text weak" id="strengthText">弱</span>
                </div>
                <ul class="password-hints">
                    <li class="hint">○ 至少8位</li>
                    <li class="hint">○ 包含大写字母</li>
                    <li class="hint">○ 包含小写字母</li>
                    <li class="hint">○ 包含数字</li>
                </ul>
                <div class="field-error"></div>
            </div>

            <div class="field">
                <label>确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" required autocomplete="new-password" minlength="8" maxlength="128">
                <div class="field-error"></div>
            </div>

            <div class="field">
                <label>邮箱验证码</label>
                <div class="captcha-row">
                    <input type="text" id="emailCode" name="emailCode" placeholder="请输入6位验证码" required maxlength="6" autocomplete="off" pattern="[0-9]{6}">
                    <button type="button" class="captcha-refresh" id="sendCodeBtn">发送验证码</button>
                </div>
                <div class="field-error"></div>
            </div>

            <div class="agreements">
                <label>
                    <input type="checkbox" id="agreeTerms" required>
                    <span>我已阅读并同意 <a href="/frontend/terms.html" target="_blank">《用户协议》</a> 和 <a href="/frontend/privacy.html" target="_blank">《隐私政策》</a></span>
                </label>
            </div>

            <button type="submit" class="btn" id="btn">注 册</button>
        </form>
        <div class="alt">已有账号？<a href="/login">立即登录</a></div>
    </div>

    <div class="footer">
        © EDA 国家集成电路设计自动化技术创新中心 · <a href="https://www.nctieda.com/" target="_blank">www.nctieda.com</a>
    </div>
</div>

<script src="/frontend/assets/js/auth-utils.js"></script>
<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const passwordInput = document.getElementById('password');
const togglePasswordBtn = document.getElementById('togglePassword');
const strengthBar = document.getElementById('strengthBar');
const strengthText = document.getElementById('strengthText');
const hintsContainer = document.querySelector('.password-hints');
const sendCodeBtn = document.getElementById('sendCodeBtn');
const emailInput = document.getElementById('email');
const usernameInput = document.getElementById('username');
const emailCodeInput = document.getElementById('emailCode');

let countdown = 0;

// 发送邮箱验证码
sendCodeBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!email) {
        showFieldError(emailInput, '请先输入邮箱');
        return;
    }

    if (!validateEmail(email)) {
        showFieldError(emailInput, '请输入有效的邮箱地址');
        return;
    }

    // 验证密码
    if (!password) {
        showFieldError(passwordInput, '请先输入密码');
        return;
    }

    if (!confirmPassword) {
        showFieldError(document.getElementById('confirmPassword'), '请先输入确认密码');
        return;
    }

    if (password !== confirmPassword) {
        showFieldError(document.getElementById('confirmPassword'), '两次输入的密码不一致');
        return;
    }

    if (countdown > 0) return;

    sendCodeBtn.disabled = true;
    sendCodeBtn.textContent = '发送中...';

    try {
        await api('/api/v1/auth/send-email-code?email=' + encodeURIComponent(email), {
            method: 'POST'
        });

        msg.className = 'msg success';
        msg.textContent = '验证码已发送，请查收邮件';

        // 开始60秒倒计时
        countdown = 60;
        const timer = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                sendCodeBtn.textContent = `${countdown}秒后重试`;
            } else {
                clearInterval(timer);
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = '重新发送';
            }
        }, 1000);
    } catch (err) {
        msg.className = 'msg error';
        msg.textContent = err.message;
        sendCodeBtn.disabled = false;
        sendCodeBtn.textContent = '发送验证码';
    }
});

passwordInput.addEventListener('input', () => {
    updatePasswordStrength(passwordInput.value, strengthBar, strengthText, hintsContainer);
    clearFieldError(passwordInput);
});

togglePasswordBtn.addEventListener('click', () => {
    togglePasswordVisibility(passwordInput, togglePasswordBtn);
});

emailInput.addEventListener('blur', () => {
    const email = emailInput.value.trim();
    if (email && !validateEmail(email)) {
        showFieldError(emailInput, '请输入有效的邮箱地址');
    } else {
        clearFieldError(emailInput);
    }
});

usernameInput.addEventListener('blur', () => {
    const username = usernameInput.value.trim();
    if (username && !validateUsername(username)) {
        showFieldError(usernameInput, '用户名只能包含字母、数字和下划线');
    } else {
        clearFieldError(usernameInput);
    }
});

[emailInput, usernameInput, emailCodeInput].forEach(input => {
    input.addEventListener('input', () => clearFieldError(input));
});

form.onsubmit = async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    btn.disabled = true;
    btn.textContent = '注册中...';

    const fd = new FormData(e.target);
    const email = fd.get('email').trim();
    const username = fd.get('username').trim();
    const password = fd.get('password');
    const confirmPassword = fd.get('confirmPassword');
    const emailCode = fd.get('emailCode').trim();
    const agreeTerms = document.getElementById('agreeTerms').checked;

    if (!validateEmail(email)) {
        showFieldError(emailInput, '请输入有效的邮箱地址');
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
    }

    if (!validateUsername(username)) {
        showFieldError(usernameInput, '用户名只能包含字母、数字和下划线');
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
    }

    if (password !== confirmPassword) {
        showFieldError(document.getElementById('confirmPassword'), '两次输入的密码不一致');
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
    }

    if (!emailCode || emailCode.length !== 6) {
        showFieldError(emailCodeInput, '请输入6位验证码');
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
    }

    if (!agreeTerms) {
        msg.className = 'msg error';
        msg.textContent = '请同意用户协议和隐私政策';
        btn.disabled = false;
        btn.textContent = '注 册';
        return;
    }

    try {
        await api('/api/v1/auth/register', {
            method: 'POST',
            body: JSON.stringify({
                email,
                username,
                password,
                email_code: emailCode,
                agree_terms: agreeTerms
            }),
        });

        // 注册成功后自动登录
        try {
            await api('/api/v1/auth/login', {
                method: 'POST',
                body: JSON.stringify({
                    account: email,
                    password: password
                })
            });

            msg.className = 'msg success';
            msg.textContent = '注册成功！';
            setTimeout(() => location.href = '/complete-profile', 1000);
        } catch (loginErr) {
            // 登录失败，跳转到登录页
            msg.className = 'msg success';
            msg.textContent = '注册成功！请登录';
            setTimeout(() => location.href = '/login', 1500);
        }
    } catch (err) {
        msg.className = 'msg error';
        msg.textContent = err.message;

        // 不在输入框下方显示错误，统一在顶部消息框
    } finally {
        btn.disabled = false;
        btn.textContent = '注 册';
    }
};
</script>
</body>
</html>
