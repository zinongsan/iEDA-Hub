[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guochuang-app"
version = "1.0.0"
description = "国创 Web 平台后端 (FastAPI)"
requires-python = ">=3.11"
# 运行时依赖：版本与 backend/Dockerfile 保持一致，改一处请同步另一处。
dependencies = [
    "fastapi[standard]==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.0",
    "redis[hiredis]==5.1.1",
    "python-multipart==0.0.12",
    "slowapi==0.1.9",
    "jinja2==3.1.4",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
# 本地开发 / 测试额外依赖
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite==0.20.0",
]

# 本项目源码不打包安装：
#   - 本地运行靠 CWD：cd backend && uvicorn src.main:app --reload
#   - 测试靠命名空间包：从 app/ 根跑 pytest，import backend.src.*
# 因此 pip install -e ".[dev]" 仅安装上面的第三方依赖，不安装源码包。
# 显式置空以关闭 setuptools 自动发现（否则会误把 tests/ 当成包）。
[tool.setuptools]
py-modules = []
packages = []
